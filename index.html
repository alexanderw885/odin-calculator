<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div id="calc">
        <div id="screen">
            <p id="display">0</p>
        </div>
        <div id="buttons">
            <button class="small del">del</button>
            <button class="small num">7</button>
            <button class="small num">4</button>
            <button class="small num">1</button>
            <button class="small num">0</button>
            <button class="small clr">clr</button>
            <button class="small num">8</button>
            <button class="small num">5</button>
            <button class="small num">2</button>
            <button class="small">.</button>
            <button class="small operator">/</button>
            <button class="small num">9</button>
            <button class="small num">6</button>
            <button class="small num">3</button>
            <button class="small eq">=</button>
            <button class="small operator">*</button>
            <button class="large operator">-</button>
            <button class="large operator">+</button>
        </div>
    </div>
</body>
</html>
